<!DOCTYPE html>
<html>
<head>
    <title>Vulnerable XSS Example</title>
    <style>
        /* إعدادات الثيم الداكن */
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        
        h1 {
            color: #ffffff;
        }

        /* تنسيق حقل الإدخال */
        input[type="text"] {
            background-color: #2c2c2c;
            color: #ffffff;
            border: 1px solid #444;
            padding: 8px;
            border-radius: 4px;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #888;
        }

        /* تنسيق الزر */
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 9px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background-color: #45a049;
        }

        /* تنسيق مكان عرض النتيجة */
        #output {
            margin-top: 20px;
            padding: 15px;
            background-color: #1e1e1e;
            border-radius: 5px;
            border-left: 4px solid #4CAF50;
            min-height: 20px;
        }
    </style>
</head>
<body>
    <h1>XSS Vulnerability Example</h1>
    <p>This is a vulnerable page with an XSS vulnerability.</p>
    <form>
        <label for="inputText">Enter some text:</label>
        <input type="text" id="inputText">
        <button type="button" onclick="displayText()">Submit</button>
    </form>
    
    <div id="output"></div>
    
    <script>
        document.cookie = "ftCookies=If_You_See_Me_Its_Win";
        function displayText() {
            var userInput = document.getElementById("inputText").value;
            document.getElementById("output").innerHTML = "<b>" + userInput + "</b>";

            var script = document.createElement("script");
            script.textContent = userInput;
            document.body.appendChild(script);
        }
    </script>

    <div id="cookieOutput"></div>
</body>
</html>
